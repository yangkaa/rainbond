name: gw-debug
on:
  push:
    branches: [debug/standalone-gateway]
jobs:
  install:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    env:
      VERSION: v6.11.0-release
    steps:
      - name: Start
        run: |
          docker run --privileged -d -p 7070:7070 -p 80:80 -p 443:443 --name=rainbond \
            -v /opt/rainbond:/opt/rainbond -e EIP="$(hostname -I | awk '{print $1}')" \
            -e REGION_WS_PROXY_TARGET=ws://127.0.0.1:6060 -e UUID="dbg-${GITHUB_RUN_ID}-${{ matrix.n }}" \
            "registry.cn-hangzhou.aliyuncs.com/goodrain/rainbond:${VERSION}-k3s"
      - name: Wait for console
        id: wait
        continue-on-error: true
        run: |
          start=$(date +%s)
          until [ "$(curl -s -o /dev/null -m 10 -w '%{http_code}' http://127.0.0.1:7070/)" = "200" ]; do
            if [ $(( $(date +%s) - start )) -gt 720 ]; then echo "OUTCOME_FAIL"; exit 1; fi
            sleep 10
          done
          echo "OUTCOME_PASS after $(( $(date +%s) - start ))s"
      - name: Dump gateway state
        if: always()
        run: |
          d() { docker exec rainbond "$@"; }
          kc() { d /bin/k3s kubectl "$@"; }
          echo "### outcome ${{ steps.wait.outcome }}"
          kc get endpoints -n rbd-system rbd-app-ui -o wide || true
          kc get endpointslices -n rbd-system -l kubernetes.io/service-name=rbd-app-ui -o jsonpath='{.items[0].metadata.annotations}' || true; echo
          for p in /v1/routes /v1/upstreams /v1/stream_routes /v1/services; do
            echo "### control $p"; d curl -s -m 5 "http://127.0.0.1:9090$p" | head -c 30000; echo
          done
          for pre in /apisix/upstreams/ /apisix/stream_routes/; do
            echo "### etcd $pre"
            k=$(printf '%s' "$pre" | base64 -w0); e=$(printf '%s' "${pre%/}0" | base64 -w0)
            d curl -s -m 5 -X POST http://127.0.0.1:12379/v3/kv/range -d "{\"key\":\"$k\",\"range_end\":\"$e\"}" \
              | python3 -c 'import sys,json,base64
          r=json.load(sys.stdin)
          print("header", r.get("header"))
          for kv in r.get("kvs",[]): print(base64.b64decode(kv["key"]).decode(), kv.get("mod_revision"), base64.b64decode(kv["value"]).decode()[:600])' || true
          done
      - name: Restart gateway and retry
        if: steps.wait.outcome == 'failure'
        run: |
          kc() { docker exec rainbond /bin/k3s kubectl "$@"; }
          kc delete pod -n rbd-system -l name=rbd-gateway --wait=false
          start=$(date +%s)
          until [ "$(curl -s -o /dev/null -m 10 -w '%{http_code}' http://127.0.0.1:7070/)" = "200" ]; do
            if [ $(( $(date +%s) - start )) -gt 300 ]; then echo "RESTART_FAIL"; exit 0; fi
            sleep 10
          done
          echo "RESTART_PASS after $(( $(date +%s) - start ))s"
